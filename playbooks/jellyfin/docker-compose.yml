networks:
  caddy_caddynet:
    external: true
services:
  jelly:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jelly
    environment:
      - PUID=1000
      - PGID=999
      - TZ=Etc/UTC
      # - JELLYFIN_PublishedServerUrl=192.168.0.5 #optional
    volumes:
      - /toshpool/apps/jelly/library:/config
      - /toshpool/apps/jelly/tvseries:/data/tvshows
      - /toshpool/apps/jelly/movies:/data/movies
    ports:
      - 8096:8096
      - 8920:8920 #optional
      - 7359:7359/udp #optional
      - 1900:1900/udp #optional
    restart: unless-stopped
    networks:
      - caddy_caddynet
